<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>นับถอยหลังกลับบ้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3ee;--bg2:#ffc9dd;--card:#fff7fa;--ink:#6b1a40;--muted:#a65a7c;--pink:#ff5c9a;--pink2:#ff8fb8;--line:#ff5c9a33}
@media (prefers-color-scheme:dark){:root{--bg1:#3a0f26;--bg2:#52183a;--card:#4a1633;--ink:#ffe3ee;--muted:#e6a3c0;--pink:#ff7aae;--pink2:#ffa6c8;--line:#ff7aae44}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Prompt,"Noto Sans Thai",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow-x:hidden}
.heart{position:absolute;color:var(--pink2);opacity:.35;user-select:none;pointer-events:none}
main{width:100%;max-width:640px;text-align:center;position:relative;z-index:1}
h1{font-family:Mali,Prompt,sans-serif;font-size:clamp(1.6rem,6vw,2.4rem);font-weight:600;margin:0 0 6px;color:var(--pink)}
.sub{margin:0 0 28px;color:var(--muted);font-size:.95rem}
#count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 28px}
.u{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 6px 14px}
.u b{display:block;font-size:clamp(2rem,10vw,3.6rem);font-weight:600;line-height:1.1;color:var(--pink);font-variant-numeric:tabular-nums}
.u span{font-size:.85rem;color:var(--muted)}
#done{display:none;font-family:Mali,Prompt,sans-serif;font-size:clamp(2rem,9vw,3.4rem);font-weight:600;color:var(--pink);margin:0 0 28px}
.bar{height:16px;background:var(--card);border:2px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink2),var(--pink));border-radius:999px;transition:width 1s linear}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin:8px 4px 28px}
label{font-size:.9rem;color:var(--muted)}
input{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 12px;margin-left:8px}
input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
@media (max-width:420px){#count{gap:8px}.u{border-radius:16px}}
</style>
</head>
<body>
<span class="heart" style="top:8%;left:10%;font-size:48px">♥</span>
<span class="heart" style="top:18%;right:12%;font-size:30px">♥</span>
<span class="heart" style="bottom:14%;left:16%;font-size:34px">♥</span>
<span class="heart" style="bottom:8%;right:9%;font-size:56px">♥</span>
<main>
  <h1>เหลืออีกนิดเดียวก็ได้กลับบ้านแล้ว</h1>
  <p class="sub">พฤหัสบดีที่ 22 ตุลาคม 2569 ช่วงบ่าย</p>
  <div id="count">
    <div class="u"><b id="d">0</b><span>วัน</span></div>
    <div class="u"><b id="h">00</b><span>ชั่วโมง</span></div>
    <div class="u"><b id="m">00</b><span>นาที</span></div>
    <div class="u"><b id="s">00</b><span>วินาที</span></div>
  </div>
  <div id="done">ได้เวลากลับบ้านแล้ว ♥</div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pb"><i id="fill"></i></div>
  <div class="meta"><span>เริ่มนับ: จันทร์ 00:00 น.</span><span id="pct">0%</span></div>
  <label for="t">เวลากลับบ้าน<input type="time" id="t" value="15:00"></label>
</main>
<script>
var START=new Date(2026,9,19,0,0,0), tgt;
var $=function(i){return document.getElementById(i)};
function pad(n){return String(n).padStart(2,"0")}
function load(){try{var v=localStorage.getItem("home-time");if(v)$("t").value=v}catch(e){}}
function setTarget(){
  var p=($("t").value||"15:00").split(":");
  tgt=new Date(2026,9,22,+p[0],+p[1],0);
  try{localStorage.setItem("home-time",$("t").value)}catch(e){}
}
function tick(){
  var now=new Date(),diff=tgt-now;
  var pct=Math.min(100,Math.max(0,(now-START)/(tgt-START)*100));
  $("fill").style.width=pct+"%";
  $("pct").textContent=Math.round(pct)+"%";
  $("pb").setAttribute("aria-valuenow",Math.round(pct));
  if(diff<=0){$("count").style.display="none";$("done").style.display="block";return}
  $("count").style.display="grid";$("done").style.display="none";
  var s=Math.floor(diff/1000);
  $("d").textContent=Math.floor(s/86400);
  $("h").textContent=pad(Math.floor(s%86400/3600));
  $("m").textContent=pad(Math.floor(s%3600/60));
  $("s").textContent=pad(s%60);
}
$("t").addEventListener("input",function(){setTarget();tick()});
load();setTarget();tick();setInterval(tick,1000);
</script>
</body>
</html>
